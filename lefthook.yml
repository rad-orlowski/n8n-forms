pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{ts,tsx}"
      run: bun run lint {staged_files}
    format:
      glob: "*.{ts,tsx,json,css,scss}"
      # --no-errors-on-unmatched: biome exits 1 when every passed path is ignored
      # (e.g. a commit touching only biome-ignored forms/form.schema.json), which would
      # abort the whole commit. This silences that empty-set error.
      run: bun biome format --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    typecheck:
      run: bun tsc -b --noEmit
    secrets:
      # --no-gitignore: lefthook passes explicit paths, not globs;
      # without this flag secretlint v13 silently skips gitignored files
      # even when they've been force-staged.
      run: bun secretlint --no-gitignore {staged_files}
    markdown:
      glob: "*.md"
      run: bun markdownlint-cli2 {staged_files}
    sort-pkg:
      glob: "package.json"
      run: bun sort-package-json {staged_files}
      stage_fixed: true
    docs-generate:
      # Regenerate autogenerated markdown sections when trigger files change.
      # stage_fixed re-stages any .md files updated by the transform so they
      # land in the commit automatically.
      glob: "{**/*.md,forms/**/*.form.{json5,yaml,yml},src/components/fields/index.ts,package.json}"
      run: bun run docs:generate
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: bun commitlint --edit {1}

pre-push:
  commands:
    lint:
      # Full-project lint on push — pre-commit only lints staged files, so
      # errors in already-committed files would otherwise reach CI unchecked.
      run: bun run lint
    docs-check:
      # Safety net: catches --no-verify bypasses. Regenerates docs and fails
      # if any .md files were stale (meaning someone committed without running
      # the pre-commit docs-generate hook). Covers every .md the generator can
      # rewrite (README, CONTRIBUTING, .claude/**), not just README.
      run: bun run docs:generate && git diff --exit-code -- '*.md'
    knip:
      run: bun knip
    audit:
      # Two advisories are ignored: both are moderate quadratic-complexity DoS
      # issues in dev-only tooling deps with no reachable patched version —
      # markdown-it (GHSA-6v5v-wf23-fmfq, via markdownlint-cli2) and js-yaml
      # (GHSA-h67p-54hq-rp68, via markdownlint/markdown-magic/secretlint/
      # commitlint). They are devDependencies, never shipped, and only parse
      # trusted local files. Revisit when upstream publishes fixes.
      run: bun audit --ignore=GHSA-6v5v-wf23-fmfq --ignore=GHSA-h67p-54hq-rp68
    depcruise:
      run: bun depcruise src --config .dependency-cruiser.cjs
    test:
      run: bun run test:coverage
    build:
      run: bun run build
    schema:
      run: bun run schema:generate && git diff --exit-code forms/form.schema.json
