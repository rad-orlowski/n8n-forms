# Bun test runner config.
#
# The Bun-runtime server files (db.ts → bun:sqlite, routes/* → the Hono app)
# cannot be imported under vitest's Node runtime, so they are covered here by
# `bun test` instead. Specs are named `*.bun.test.ts`; run them with
# `bun test bun.test` (see the `test` / `test:coverage` package scripts), which
# filters to those files and skips the vitest suites that use `vi.*`.
[test]
coverageThreshold = 0.8
coverageSkipTestFiles = true
# Node-runtime modules covered by the vitest suite — src/lib/* (schema.ts,
# expr.ts, resolve-fields.ts, …) and forms-loader.ts (see forms-loader.test.ts).
# They get pulled into this report only as transitive imports of the Bun-runtime
# server files under test, so exclude them to keep this gate scoped to bun-only
# code (db.ts → bun:sqlite, the Hono routes).
coveragePathIgnorePatterns = ["**/lib/**", "**/forms-loader.ts"]
