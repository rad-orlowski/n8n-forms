name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      # `build` runs `tsc -b && vite build`, so this also typechecks.
      # No .env is needed: missing VITE_WEBHOOK_* vars just resolve to
      # undefined at build time and do not fail the build.
      - name: Build
        run: bun run build
